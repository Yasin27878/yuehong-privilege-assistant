name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare project config files
        shell: bash
        run: |
          cp server.properties.example server.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          printf 'api.useLocal=false\n' >> local.properties
          chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" "cmake;3.22.1" "ndk;29.0.13113456"

      - name: Build debug APK
        shell: bash
        run: ./gradlew :manager:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuehong-debug-apk
          path: |
            manager/build/outputs/apk/debug/*.apk
            out/apk/*.apk
